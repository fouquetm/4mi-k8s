apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          resources:
            limits:
              cpu: 500m
              memory: 100M
            requests:
              cpu: 200m
              memory: 50M
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Server=tcp:mssql,1433;Initial Catalog=RabbitMqDemo;Persist Security Info=False;User ID=sa;Password=P@ssw0rd2023!;Connection Timeout=30;
            - name: RabbitMQ__Hostname
              valueFrom:
                configMapKeyRef:
                  key: rabbitmq-hostname
                  name: global-config
            - name: RabbitMQ__Password
              value: admin
            - name: RabbitMQ__Username
              value: admin
            - name: dummy__variable
              valueFrom:
                configMapKeyRef:
                  key: dummy-variable
                  name: api-config
          image: matthieuf/pubsub-api:1.3
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: api-config
      restartPolicy: Always
